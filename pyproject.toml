[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epad_signature_pad_hid_driver"
version = "0.1.0"
description = "Unofficial Python driver for ePadLink signature pads over raw USB HID -- no vendor driver required."
authors = [
    { name = "CaptainCodeAU" },
]
readme = "README.md"
requires-python = ">=3.13, <3.14"
license = { text = "MIT" } # Example license
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # Add core runtime dependencies here
    "hidapi>=0.15.0",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "mypy",  # Type checker for static analysis
]

[project.urls]
Homepage = "https://github.com/CaptainCodeAU/epad-signature-pad-hid-driver"
Repository = "https://github.com/CaptainCodeAU/epad-signature-pad-hid-driver"

[project.scripts]
epad-signature-pad-hid-driver = "epad_signature_pad_hid_driver.cli:main"

# Use hatch to manage version based on __init__.py
[tool.hatch.version]
path = "src/epad_signature_pad_hid_driver/__init__.py"

# Example Ruff configuration (adjust as needed)
[tool.ruff]
src = ["src", "tests"]
line-length = 88
indent-width = 4
target-version = "py313" # e.g., py311

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "A", "RUF"] # Sensible defaults
ignore = ["E501"] # Handled by formatter
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["epad_signature_pad_hid_driver"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # Allow 'assert' in tests

# Example Pytest configuration
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=epad_signature_pad_hid_driver --cov-report=term-missing"
testpaths = ["tests"]
python_files = "test_*.py"

# Mypy type checking configuration
[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
module = "hid"
ignore_missing_imports = true
